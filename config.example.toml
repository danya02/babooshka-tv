# babooshka configuration file
# Default location: /etc/babooshka/config.toml
# Override with: babooshka --config /path/to/config.toml

# Path to the JSON file used to save and restore playback position
play_state = "/srv/play-state.json"

# Path to the JSON playlist file (list of video file paths)
playlist = "/srv/playlist.json"

# Unix socket for software switch overrides (set to "" to disable).
# Usage: echo on | nc -U /tmp/run/babooshka-control.sock
#        echo off | nc -U /tmp/run/babooshka-control.sock
# control_socket = "/tmp/run/babooshka-control.sock"

# Optional path to a per-file gain map generated by `playlistctl`.
# Maps video file paths to dB gain adjustments for volume normalisation.
# Leave commented out (or set to "") to disable.
# NOTE: this and gain_enabled are top-level keys — they must stay above the
# first [section] header, or they will be parsed as part of that section.
# gain_db = "/srv/gain_db.json"

# Whether the gains in `gain_db` are actually applied.
# When false (the default) the map is still loaded and every entry is logged as
# "would apply ... dB", so a run can be checked against real playback before the
# volume of every film changes at once. Flip to true once the gains sound right.
# gain_enabled = false

[gpio]
# BCM pin number for the switch input.
# The switch should connect this pin to ground when inactive.
# The RPi's internal pull-up resistor is enabled, so the pin reads HIGH when the switch is open.
switch_pin = 17

# BCM pin number for the boot indicator LED output.
led_pin = 27

[tv]
# How to control TV power: "smartplug", "cec", "both", or "dry_run".
# "both" tries smartplug first and falls back to CEC on failure.
# "dry_run" skips all TV control and shows a swaynag notification instead (useful for debugging).
control = "smartplug"

# Home Assistant base URL (required for "smartplug" and "both")
ha_url = "http://10.22.0.50:8123"

# Home Assistant long-lived access token (required for "smartplug" and "both")
ha_token = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiI5YjczYTZiNWZiY2U0OTNjYmE4ZGE4ZTJlNzBiYTlkYyIsImlhdCI6MTc2ODI1NjA0OCwiZXhwIjoyMDgzNjE2MDQ4fQ.ux7beB3jProrHhOWrngcOGgrYR6-68yLoFq026_b6a0"

# Home Assistant entity ID for the smart plug switch
ha_entity = "switch.bare_tv_switch"

[hdmi]
# How to detect when the TV is ready after powering on: "drm" or "timeout".
# "drm" polls a sysfs file; "timeout" simply waits a fixed number of seconds.
detect = "drm"

# Seconds to wait when using timeout mode
timeout_secs = 15

# Path to the DRM connector status sysfs file (used in "drm" mode).
# Find the right path with: cat /sys/class/drm/*/status
drm_path = "/sys/class/drm/card1-HDMI-A-1/status"
